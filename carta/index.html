<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para vos ❤️</title>
  <!-- Google Fonts: Playfair Display & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Tipografía y fuentes personalizadas */
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #ffeef2, #ffd6e0, #f7cad0);
      touch-action: manipulation;
    }
    .font-serif-romantic {
      font-family: 'Playfair Display', serif;
    }

    /* Animación de flotar y latir para el sobre */
    @keyframes floatAndPulse {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-10px) scale(1.03);
      }
    }
    .animate-envelope {
      animation: floatAndPulse 3s ease-in-out infinite;
    }

    /* Sobre 3D en CSS */
    .envelope-wrapper {
      position: relative;
      cursor: pointer;
      perspective: 1000px;
    }

    .envelope {
      position: relative;
      width: 250px;
      height: 170px;
      background: #fdf0ed;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 35px -10px rgba(184, 51, 80, 0.25), 0 8px 16px rgba(0,0,0,0.06);
    }

    /* Solapa superior que se dobla */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      border-left: 125px solid transparent;
      border-right: 125px solid transparent;
      border-top: 100px solid #f8d7da;
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.08));
    }

    /* Bolsillo frontal del sobre */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      border-left: 125px solid #fce4e8;
      border-right: 125px solid #fce4e8;
      border-bottom: 95px solid #f5c2c7;
      border-radius: 0 0 16px 16px;
      z-index: 3;
    }

    /* Sello de corazón */
    .wax-seal {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #e63946, #a81d2c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(168, 29, 44, 0.4);
      z-index: 5;
      transition: transform 0.3s ease, opacity 0.4s ease;
    }

    .envelope-wrapper:active .wax-seal {
      transform: translate(-50%, -50%) scale(0.92);
    }

    /* Estado abierto */
    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      pointer-events: none;
    }

    /* Fondo Canvas para corazones flotantes */
    #heartsCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    /* Animación suave para el pop-up */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .modal-enter {
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4 relative overflow-hidden select-none">

  <!-- Lienzo interactivo para lluvia y ráfagas de corazones -->
  <canvas id="heartsCanvas"></canvas>

  <!-- PANTALLA INICIAL: SOBRE CERRADO -->
  <main id="letterContainer" class="flex flex-col items-center justify-center text-center z-10 transition-opacity duration-700 ease-in-out">
    
    <!-- Cartelito indicador -->
    <div class="mb-8 px-5 py-2.5 bg-white/80 backdrop-blur-md rounded-full shadow-sm border border-rose-100/60 inline-flex items-center gap-2">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-400 animate-ping"></span>
      <p class="text-rose-900 font-medium text-xs sm:text-sm tracking-wide">
        Tenés un mensaje especial
      </p>
    </div>

    <!-- Sobre con animación interactiva -->
    <div id="envelopeTrigger" class="envelope-wrapper animate-envelope" role="button" aria-label="Abrir carta">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-pocket"></div>
        <div class="wax-seal">
          <svg class="w-5 h-5 text-white filter drop-shadow" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
    </div>

    <p class="mt-8 text-rose-800/80 font-normal text-sm tracking-wide">
      Tocalo para abrir ✨
    </p>
  </main>

  <!-- POP-UP / MODAL ROMÁNTICO (Oculto al inicio) -->
  <section id="modalBackdrop" class="fixed inset-0 bg-rose-950/40 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4 transition-all duration-300 opacity-0">
    
    <div id="modalBox" class="bg-white/95 backdrop-blur-md w-full max-w-sm rounded-3xl p-6 sm:p-8 text-center shadow-2xl border border-rose-100 relative">
      
      <!-- Detalle superior floral / decorativo -->
      <div class="text-3xl mb-2 select-none">💌</div>

      <!-- Título Principal -->
      <h1 class="font-serif-romantic text-3xl sm:text-4xl font-bold text-rose-900 tracking-tight mb-3">
        Te amo! ❤️
      </h1>

      <!-- Dedicatoria personalizable -->
      <div class="text-rose-800/90 text-sm sm:text-base leading-relaxed space-y-3 font-normal my-4 px-1">
        <p>
          Gracias por hacer cada uno de mis días más felices gordita
        </p>
        <p class="text-rose-950 font-medium italic text-sm">
          Sos lo más lindo que tengo en mi vida
        </p>
      </div>

      <!-- Separador decorativo -->
      <div class="flex items-center justify-center gap-2 my-5 opacity-40">
        <span class="h-px w-10 bg-rose-400"></span>
        <span class="text-xs text-rose-500">✦</span>
        <span class="h-px w-10 bg-rose-400"></span>
      </div>

      <!-- Acciones interactivas -->
      <div class="flex flex-col gap-3">
        <!-- Botón para disparar más corazones -->
        <button id="btnMoreHearts" type="button" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-rose-500 to-rose-600 text-white font-medium text-sm sm:text-base shadow-lg shadow-rose-500/25 active:scale-95 transition-transform duration-150 flex items-center justify-center gap-2">
          <span>Apretá acá para más amor</span>
          <span class="text-lg">💖</span>
        </button>

        <!-- Botón suave para cerrar / volver a ver el sobre -->
        <button id="btnCloseModal" type="button" class="py-2 text-xs font-semibold text-rose-400 hover:text-rose-600 transition-colors uppercase tracking-widest mt-1">
          Cerrar
        </button>
      </div>

      <!-- Firma al pie -->
      <p class="mt-5 text-[11px] text-rose-400/80 font-light">
        Hecho con amor de tu pituelo
      </p>
    </div>
  </section>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    // Referencias del DOM
    const envelope = document.getElementById('envelopeTrigger');
    const letterContainer = document.getElementById('letterContainer');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalBox = document.getElementById('modalBox');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnMoreHearts = document.getElementById('btnMoreHearts');
    const canvas = document.getElementById('heartsCanvas');
    const ctx = canvas.getContext('2d');

    // Configuración del canvas responsivo
    let particles = [];
    let animationId;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Paleta de colores para los corazones flotantes
    const heartColors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a', '#a4133c', '#ffb3c1'];

    // Clase para las partículas de corazón
    class HeartParticle {
      constructor(x, y, isExplosion = false) {
        this.x = x || Math.random() * canvas.width;
        this.y = y || canvas.height + 20;
        this.size = Math.random() * 14 + 10;
        this.color = heartColors[Math.floor(Math.random() * heartColors.length)];
        this.opacity = 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.05;

        if (isExplosion) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 3;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 2;
          this.decay = Math.random() * 0.015 + 0.01;
        } else {
          // Movimiento flotante hacia arriba
          this.vx = (Math.random() - 0.5) * 1.5;
          this.vy = -(Math.random() * 2.5 + 1.8);
          this.decay = Math.random() * 0.006 + 0.003;
        }
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotationSpeed;
        this.opacity -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;

        // Dibujar forma de corazón con curvas Bézier
        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
        ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
        ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
        ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    // Bucle de animación para partículas
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.opacity <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Función para crear ráfagas de corazones
    function spawnHearts(amount, x, y, isExplosion = false) {
      for (let i = 0; i < amount; i++) {
        particles.push(new HeartParticle(x, y, isExplosion));
      }
    }

    // Interacción al tocar el sobre
    let isOpened = false;

    envelope.addEventListener('click', () => {
      if (isOpened) return;
      isOpened = true;

      // Animación de apertura física del sobre
      envelope.classList.remove('animate-envelope');
      envelope.classList.add('open');

      // Explosión de corazones saliendo del centro del sobre
      const rect = envelope.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      spawnHearts(35, centerX, centerY, true);

      // Desvanecer sobre y abrir modal suavemente
      setTimeout(() => {
        letterContainer.classList.add('opacity-0');
        
        setTimeout(() => {
          letterContainer.classList.add('hidden');
          modalBackdrop.classList.remove('hidden');

          // Forzar reflow para animación suave de opacidad
          void modalBackdrop.offsetWidth;
          modalBackdrop.classList.remove('opacity-0');
          modalBox.classList.add('modal-enter');

          // Generar una lluvia continua de corazones suaves desde el fondo
          const interval = setInterval(() => {
            if (modalBackdrop.classList.contains('hidden')) {
              clearInterval(interval);
            } else {
              spawnHearts(2, Math.random() * canvas.width, canvas.height + 10, false);
            }
          }, 400);
        }, 400);
      }, 700);
    });

    // Botón para generar ráfagas adicionales de corazones
    btnMoreHearts.addEventListener('click', (e) => {
      const rect = btnMoreHearts.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top;
      spawnHearts(25, x, y, true);
    });

    // Botón para cerrar modal y reiniciar el sobre
    btnCloseModal.addEventListener('click', () => {
      modalBackdrop.classList.add('opacity-0');
      
      setTimeout(() => {
        modalBackdrop.classList.add('hidden');
        letterContainer.classList.remove('hidden');
        
        void letterContainer.offsetWidth;
        letterContainer.classList.remove('opacity-0');
        
        envelope.classList.remove('open');
        envelope.classList.add('animate-envelope');
        isOpened = false;
      }, 300);
    });
  </script>
</body>
</html>
